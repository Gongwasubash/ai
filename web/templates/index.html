<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Second Brain AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0a0a0a;
            --surface: #141414;
            --surface2: #1e1e1e;
            --surface3: #282828;
            --border: #2a2a2a;
            --text: #e8e8e8;
            --text-dim: #777;
            --accent: #7c5cfc;
            --accent2: #a78bfa;
            --accent-dim: #5a3fd4;
            --green: #4ade80;
            --blue: #60a5fa;
            --orange: #fb923c;
            --red: #f87171;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }

        /* ─── Layout ─────────────────────────────────── */
        .app {
            display: flex;
            height: 100vh;
        }

        /* ─── Sidebar ────────────────────────────────── */
        .sidebar {
            width: 280px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: transform 0.3s;
        }

        .sidebar-header {
            padding: 24px 20px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-header h1 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sidebar-header p {
            font-size: 12px;
            color: var(--text-dim);
            margin-top: 4px;
        }

        .nav { flex: 1; overflow-y: auto; padding: 12px; }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-dim);
            transition: all 0.15s;
            margin-bottom: 2px;
        }

        .nav-item:hover { background: var(--surface2); color: var(--text); }
        .nav-item.active { background: var(--accent); color: white; }
        .nav-item .icon { font-size: 18px; width: 24px; text-align: center; }
        .nav-item .badge {
            margin-left: auto;
            background: var(--surface3);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
        }
        .nav-item.active .badge { background: rgba(255,255,255,0.2); }

        .nav-section {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-dim);
            padding: 20px 14px 8px;
            font-weight: 600;
        }

        /* ─── Main ───────────────────────────────────── */
        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

        .header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .search-box {
            flex: 1;
            max-width: 500px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 10px 16px 10px 40px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: border-color 0.15s;
        }

        .search-box input:focus { border-color: var(--accent); }
        .search-box::before {
            content: "🔍";
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
        }

        .content { flex: 1; overflow-y: auto; padding: 24px; }

        /* ─── Chat View ──────────────────────────────── */
        .chat-view {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 0;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            scroll-behavior: smooth;
        }

        .chat-welcome {
            text-align: center;
            padding: 60px 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .chat-welcome h2 {
            font-size: 28px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .chat-welcome p {
            color: var(--text-dim);
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .quick-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .quick-btn {
            padding: 10px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-dim);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .quick-btn:hover {
            border-color: var(--accent);
            color: var(--text);
            background: var(--surface2);
        }

        .chat-msg {
            max-width: 750px;
            margin: 0 auto 20px;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chat-msg.user { display: flex; justify-content: flex-end; }
        .chat-msg.user .bubble {
            background: var(--accent);
            color: white;
            border-radius: 18px 18px 4px 18px;
            max-width: 80%;
        }

        .chat-msg.bot .bubble {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px 18px 18px 4px;
        }

        .chat-msg .bubble {
            padding: 14px 18px;
            font-size: 14px;
            line-height: 1.7;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .chat-msg .sources {
            margin-top: 10px;
            padding: 0 18px;
        }

        .chat-msg .sources span {
            display: inline-block;
            background: var(--surface2);
            border: 1px solid var(--border);
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 11px;
            color: var(--text-dim);
            margin-right: 4px;
            margin-bottom: 4px;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 14px 18px;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: var(--text-dim);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(1) { animation-delay: 0s; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        .chat-input-area {
            padding: 16px 24px 24px;
            border-top: 1px solid var(--border);
            background: var(--bg);
        }

        .chat-input-wrapper {
            max-width: 750px;
            margin: 0 auto;
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .chat-input-wrapper textarea {
            flex: 1;
            padding: 12px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            resize: none;
            min-height: 46px;
            max-height: 150px;
            line-height: 1.5;
            transition: border-color 0.15s;
        }

        .chat-input-wrapper textarea:focus { border-color: var(--accent); }

        .send-btn {
            width: 46px;
            height: 46px;
            background: var(--accent);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
            flex-shrink: 0;
        }

        .send-btn:hover { background: var(--accent-dim); }
        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* ─── Card Grid ──────────────────────────────── */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .card:hover { border-color: var(--accent); transform: translateY(-2px); }
        .card h3 { font-size: 15px; margin-bottom: 8px; }
        .card p { font-size: 13px; color: var(--text-dim); line-height: 1.5; }
        .card .meta {
            margin-top: 12px;
            font-size: 11px;
            color: var(--text-dim);
        }

        /* ─── Doc View ───────────────────────────────── */
        .doc-view { max-width: 800px; }
        .doc-view h1 { font-size: 28px; margin-bottom: 16px; }
        .doc-view h2 { font-size: 20px; margin: 24px 0 12px; color: var(--accent); }
        .doc-view h3 { font-size: 16px; margin: 16px 0 8px; }
        .doc-view p { line-height: 1.7; margin-bottom: 12px; }
        .doc-view ul, .doc-view ol { margin: 12px 0; padding-left: 24px; }
        .doc-view li { margin-bottom: 6px; line-height: 1.6; }
        .doc-view code {
            background: var(--surface2);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 13px;
        }
        .doc-view blockquote {
            border-left: 3px solid var(--accent);
            padding-left: 16px;
            color: var(--text-dim);
            margin: 12px 0;
        }
        .doc-view a { color: var(--accent); text-decoration: none; }
        .doc-view a:hover { text-decoration: underline; }

        /* ─── Stats ──────────────────────────────────── */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 24px;
            text-align: center;
        }

        .stat-card .number {
            font-size: 36px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-card .label {
            font-size: 12px;
            color: var(--text-dim);
            margin-top: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ─── Markdown in chat ───────────────────────── */
        .chat-msg .bubble h1, .chat-msg .bubble h2, .chat-msg .bubble h3 {
            margin: 12px 0 8px;
        }
        .chat-msg .bubble h1 { font-size: 18px; }
        .chat-msg .bubble h2 { font-size: 16px; color: var(--accent2); }
        .chat-msg .bubble h3 { font-size: 14px; }
        .chat-msg .bubble ul, .chat-msg .bubble ol { padding-left: 20px; margin: 8px 0; }
        .chat-msg .bubble li { margin-bottom: 4px; }
        .chat-msg .bubble strong { color: var(--accent2); }
        .chat-msg .bubble code {
            background: var(--surface3);
            padding: 1px 5px;
            border-radius: 3px;
            font-size: 12px;
        }

        /* ─── Mobile ─────────────────────────────────── */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                height: 100%;
                z-index: 100;
                transform: translateX(-100%);
            }
            .sidebar.open { transform: translateX(0); }
            .mobile-toggle {
                display: flex !important;
            }
            .card-grid { grid-template-columns: 1fr; }
        }

        .mobile-toggle {
            display: none;
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 101;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 14px;
            color: var(--text);
            cursor: pointer;
            font-size: 18px;
        }

        .back-link {
            color: var(--accent);
            font-size: 13px;
            text-decoration: none;
            margin-bottom: 16px;
            display: inline-block;
        }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="app">
        <button class="mobile-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')">☰</button>

        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>🧠 Second Brain AI</h1>
                <p>Ask anything about your data</p>
            </div>
            <nav class="nav">
                <div class="nav-item active" onclick="showView('chat')" id="nav-chat">
                    <span class="icon">💬</span> AI Chat
                </div>
                <div class="nav-item" onclick="showView('home')" id="nav-home">
                    <span class="icon">🏠</span> Dashboard
                </div>
                <div class="nav-item" onclick="showView('wiki')" id="nav-wiki">
                    <span class="icon">📚</span> Wiki
                    <span class="badge" id="wiki-count">-</span>
                </div>
                <div class="nav-item" onclick="showView('crm')" id="nav-crm">
                    <span class="icon">👥</span> CRM
                    <span class="badge" id="crm-count">-</span>
                </div>
                <div class="nav-item" onclick="showView('journal')" id="nav-journal">
                    <span class="icon">📝</span> Journal
                    <span class="badge" id="journal-count">-</span>
                </div>

                <div class="nav-section">Wiki Sections</div>
                <div class="nav-item" onclick="showView('wiki', 'sources')">
                    <span class="icon">📄</span> Sources
                </div>
                <div class="nav-item" onclick="showView('wiki', 'entities')">
                    <span class="icon">🏷️</span> Entities
                </div>
                <div class="nav-item" onclick="showView('wiki', 'concepts')">
                    <span class="icon">💡</span> Concepts
                </div>
                <div class="nav-item" onclick="showView('wiki', 'analyses')">
                    <span class="icon">📊</span> Analyses
                </div>
            </nav>
        </aside>

        <main class="main">
            <div class="header">
                <div class="search-box">
                    <input type="text" id="search" placeholder="Search your second brain..." onkeyup="handleSearch(event)">
                </div>
            </div>
            <div class="content" id="content"></div>
        </main>
    </div>

    <script>
        let chatHistory = [];
        let isStreaming = false;

        const API = {
            get: (url) => fetch(url).then(r => r.json()),
            post: (url, data) => fetch(url, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            }).then(r => r.json()),
        };

        // ─── Navigation ───────────────────────────────
        function showView(view, subview) {
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(`nav-${view}`)?.classList.add('active');

            const content = document.getElementById('content');
            content.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-dim)">Loading...</div>';

            switch(view) {
                case 'home': renderHome(content); break;
                case 'wiki': renderWiki(content, subview); break;
                case 'crm': renderCRM(content); break;
                case 'journal': renderJournal(content); break;
                case 'chat': renderChat(content); break;
            }

            // Close mobile sidebar
            document.querySelector('.sidebar').classList.remove('open');
        }

        // ─── Home ─────────────────────────────────────
        async function renderHome(el) {
            const stats = await API.get('/api/stats');
            el.innerHTML = `
                <h2 style="margin-bottom:24px">Dashboard</h2>
                <div class="stats-grid">
                    <div class="stat-card"><div class="number">${stats.wiki_pages}</div><div class="label">Wiki Pages</div></div>
                    <div class="stat-card"><div class="number">${stats.crm_contacts}</div><div class="label">CRM Contacts</div></div>
                    <div class="stat-card"><div class="number">${stats.journal_entries}</div><div class="label">Journal Entries</div></div>
                    <div class="stat-card"><div class="number">${stats.raw_sources}</div><div class="label">Raw Sources</div></div>
                </div>
                <h3 style="margin-bottom:12px">Recent Activity</h3>
                <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;font-size:13px;line-height:1.8;max-height:400px;overflow-y:auto" id="log-content">Loading...</div>
            `;
            const log = await API.get('/api/log');
            document.getElementById('log-content').innerHTML = renderMd(log.content.split('\n').slice(-15).join('\n'));
        }

        // ─── Wiki ─────────────────────────────────────
        async function renderWiki(el, subdir) {
            const files = subdir ? await API.get(`/api/wiki/${subdir}`) : await API.get('/api/wiki');
            el.innerHTML = `
                <a class="back-link" href="#" onclick="showView('home'); return false;">← Dashboard</a>
                <h2 style="margin-bottom:24px">${subdir ? subdir.charAt(0).toUpperCase() + subdir.slice(1) : 'All Wiki Pages'}</h2>
                <div class="card-grid">
                    ${files.map(f => `
                        <div class="card" onclick="openDoc('${f.category||''}', '${f.name}')">
                            <h3>${esc(f.title)}</h3>
                            <p>${esc(f.preview)}</p>
                            <div class="meta">${f.category||'wiki'} · ${f.modified?.split('T')[0]||''}</div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        async function openDoc(subdir, name) {
            const el = document.getElementById('content');
            el.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-dim)">Loading...</div>';
            const doc = await API.get(`/api/wiki/read/${subdir}/${name}`);
            el.innerHTML = `
                <div class="doc-view">
                    <a class="back-link" href="#" onclick="showView('wiki','${subdir}'); return false;">← Back</a>
                    ${renderMd(doc.content)}
                </div>
            `;
        }

        // ─── CRM ──────────────────────────────────────
        async function renderCRM(el) {
            const data = await API.get('/api/crm');
            el.innerHTML = `
                <a class="back-link" href="#" onclick="showView('home'); return false;">← Dashboard</a>
                <h2 style="margin-bottom:24px">CRM Contacts</h2>
                <div class="card-grid">
                    ${data.contacts.map(c => `
                        <div class="card" onclick="openCRMContact('${c.name}')">
                            <h3>${esc(c.title)}</h3>
                            <p>${esc(c.preview)}</p>
                            <div class="meta">${c.modified?.split('T')[0]||''}</div>
                        </div>
                    `).join('') || '<p style="color:var(--text-dim)">No contacts yet.</p>'}
                </div>
            `;
        }

        async function openCRMContact(name) {
            const el = document.getElementById('content');
            el.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-dim)">Loading...</div>';
            const doc = await API.get(`/api/crm/read/${name}`);
            el.innerHTML = `
                <div class="doc-view">
                    <a class="back-link" href="#" onclick="showView('crm'); return false;">← Back</a>
                    ${renderMd(doc.content)}
                </div>
            `;
        }

        // ─── Journal ──────────────────────────────────
        async function renderJournal(el) {
            const data = await API.get('/api/journal');
            el.innerHTML = `
                <a class="back-link" href="#" onclick="showView('home'); return false;">← Dashboard</a>
                <h2 style="margin-bottom:24px">Journal</h2>
                <div class="card-grid">
                    ${data.entries.map(e => `
                        <div class="card" onclick="openJournal('${e.name}')">
                            <h3>${esc(e.title)}</h3>
                            <p>${esc(e.preview)}</p>
                            <div class="meta">${e.modified?.split('T')[0]||''}</div>
                        </div>
                    `).join('') || '<p style="color:var(--text-dim)">No entries yet.</p>'}
                </div>
            `;
        }

        async function openJournal(name) {
            const el = document.getElementById('content');
            el.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-dim)">Loading...</div>';
            const doc = await API.get(`/api/journal/read/${name}`);
            el.innerHTML = `
                <div class="doc-view">
                    <a class="back-link" href="#" onclick="showView('journal'); return false;">← Back</a>
                    ${renderMd(doc.content)}
                </div>
            `;
        }

        // ─── AI Chat ──────────────────────────────────
        function renderChat(el) {
            el.innerHTML = `
                <div class="chat-view">
                    <div class="chat-messages" id="chat-messages">
                        <div class="chat-welcome">
                            <h2>What do you want to know?</h2>
                            <p>I have access to your entire second brain — wiki pages, contacts, journal entries, and source summaries. Ask me anything.</p>
                            <div class="quick-actions">
                                <div class="quick-btn" onclick="quickAsk('What are my main interests and skills?')">My interests & skills</div>
                                <div class="quick-btn" onclick="quickAsk('Summarize my recent journal entries')">Journal summary</div>
                                <div class="quick-btn" onclick="quickAsk('Who are the people in my CRM?')">My contacts</div>
                                <div class="quick-btn" onclick="quickAsk('What AI tools have I researched?')">AI tools researched</div>
                                <div class="quick-btn" onclick="quickAsk('What is the Mahispal dynasty?')">Mahispal dynasty</div>
                                <div class="quick-btn" onclick="quickAsk('What automation systems have I built?')">My automations</div>
                            </div>
                        </div>
                    </div>
                    <div class="chat-input-area">
                        <div class="chat-input-wrapper">
                            <textarea id="chat-input" placeholder="Ask about your data..." rows="1" onkeydown="handleChatKey(event)" oninput="autoResize(this)"></textarea>
                            <button class="send-btn" id="send-btn" onclick="sendChat()">▶</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 150) + 'px';
        }

        function handleChatKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendChat();
            }
        }

        function quickAsk(q) {
            document.getElementById('chat-input').value = q;
            sendChat();
        }

        async function sendChat() {
            if (isStreaming) return;

            const input = document.getElementById('chat-input');
            const msg = input.value.trim();
            if (!msg) return;

            const messages = document.getElementById('chat-messages');

            // Remove welcome screen
            const welcome = messages.querySelector('.chat-welcome');
            if (welcome) welcome.remove();

            // Add user message
            messages.innerHTML += `<div class="chat-msg user"><div class="bubble">${esc(msg)}</div></div>`;

            // Add typing indicator
            messages.innerHTML += `
                <div class="chat-msg bot" id="typing-msg">
                    <div class="bubble">
                        <div class="typing-indicator"><span></span><span></span><span></span></div>
                    </div>
                </div>
            `;
            messages.scrollTop = messages.scrollHeight;

            input.value = '';
            input.style.height = 'auto';
            isStreaming = true;
            document.getElementById('send-btn').disabled = true;

            // Store in history
            chatHistory.push({role: 'user', content: msg});

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message: msg, history: chatHistory.slice(-6)})
                });
                const data = await res.json();

                // Remove typing indicator
                document.getElementById('typing-msg')?.remove();

                // Add bot response
                let sourcesHtml = '';
                if (data.sources?.length) {
                    sourcesHtml = `<div class="sources">${data.sources.map(s => `<span>📄 ${s.split('/').pop()}</span>`).join('')}</div>`;
                }

                messages.innerHTML += `
                    <div class="chat-msg bot">
                        <div class="bubble">${renderMd(data.response || 'No response')}</div>
                        ${sourcesHtml}
                    </div>
                `;

                chatHistory.push({role: 'assistant', content: data.response || ''});

            } catch (err) {
                document.getElementById('typing-msg')?.remove();
                messages.innerHTML += `<div class="chat-msg bot"><div class="bubble" style="color:var(--red)">Error: ${err.message}</div></div>`;
            }

            isStreaming = false;
            document.getElementById('send-btn').disabled = false;
            messages.scrollTop = messages.scrollHeight;
        }

        // ─── Search ───────────────────────────────────
        async function handleSearch(e) {
            if (e.key !== 'Enter') return;
            const q = e.target.value.trim();
            if (!q) return;
            const el = document.getElementById('content');
            el.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-dim)">Searching...</div>';
            const results = await API.get(`/api/search?q=${encodeURIComponent(q)}`);
            el.innerHTML = `
                <h2 style="margin-bottom:24px">Results for "${esc(q)}"</h2>
                <div class="card-grid">
                    ${results.map(r => `
                        <div class="card" onclick="openSearchResult('${r.path}')">
                            <h3>${esc(r.file)}</h3>
                            <p>${r.matches.map(m => esc(m.text)).join('<br>')}</p>
                            <div class="meta">${r.path}</div>
                        </div>
                    `).join('') || '<p style="color:var(--text-dim)">No results found.</p>'}
                </div>
            `;
        }

        function openSearchResult(path) {
            const parts = path.replace(/\\/g, '/').split('/');
            const name = parts.pop().replace('.md', '');
            if (path.includes('crm')) openCRMContact(name);
            else if (path.includes('journal')) openJournal(name);
            else if (path.includes('wiki/')) openDoc(parts[parts.length-1], name);
        }

        // ─── Utils ────────────────────────────────────
        function renderMd(text) {
            if (!text) return '';
            return text
                .replace(/^### (.+)$/gm, '<h3>$1</h3>')
                .replace(/^## (.+)$/gm, '<h2>$1</h2>')
                .replace(/^# (.+)$/gm, '<h1>$1</h1>')
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.+?)\*/g, '<em>$1</em>')
                .replace(/`(.+?)`/g, '<code>$1</code>')
                .replace(/\[\[(.+?)\]\]/g, '<a href="#" onclick="quickAsk(\'Tell me about $1\'); return false;" style="color:var(--accent)">$1</a>')
                .replace(/^[-*] (.+)$/gm, '<li>$1</li>')
                .replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>')
                .replace(/\n\n/g, '</p><p>')
                .replace(/\n/g, '<br>');
        }

        function esc(text) {
            const d = document.createElement('div');
            d.textContent = text || '';
            return d.innerHTML;
        }

        // ─── Init ──────────────────────────────────────
        async function init() {
            const stats = await API.get('/api/stats');
            document.getElementById('wiki-count').textContent = stats.wiki_pages;
            document.getElementById('crm-count').textContent = stats.crm_contacts;
            document.getElementById('journal-count').textContent = stats.journal_entries;
            showView('chat');
        }

        init();
    </script>
</body>
</html>
